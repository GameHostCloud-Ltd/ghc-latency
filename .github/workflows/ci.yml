name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - run: node --check index.js
      - run: npm test
      - name: Demo library copy must match index.js
        run: diff -q index.js docs/index.js
